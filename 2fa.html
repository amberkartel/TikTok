<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Step Verification</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex flex-col justify-between max-w-md mx-auto px-6 py-4 font-sans text-gray-900">

    <!-- Top Navigation Bar -->
    <div class="flex items-center justify-between pt-2 pb-6">
        <!-- Back Arrow -->
        <button class="text-2xl text-gray-800 focus:outline-none">&larr;</button>
        <!-- Help Icon -->
        <button class="text-xl text-gray-800 focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </button>
    </div>

    <!-- Main Content Section -->
    <div class="flex-grow">
        <!-- Title and Subtitle -->
        <h1 class="text-2xl font-bold tracking-tight mb-2">2-step verification</h1>
        <p class="text-gray-600 text-sm mb-8">Use the code from your authenticator app to verify your account.</p>

        <!-- 6-Digit Code Input Fields -->
        <div class="flex justify-between gap-3 mb-6" id="otp-container">
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-input w-12 h-12 text-center text-xl font-medium border-b-2 border-gray-300 focus:border-red-500 focus:outline-none bg-transparent" />
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-input w-12 h-12 text-center text-xl font-medium border-b-2 border-gray-300 focus:border-red-500 focus:outline-none bg-transparent" />
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-input w-12 h-12 text-center text-xl font-medium border-b-2 border-gray-300 focus:border-red-500 focus:outline-none bg-transparent" />
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-input w-12 h-12 text-center text-xl font-medium border-b-2 border-gray-300 focus:border-red-500 focus:outline-none bg-transparent" />
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-input w-12 h-12 text-center text-xl font-medium border-b-2 border-gray-300 focus:border-red-500 focus:outline-none bg-transparent" />
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-input w-12 h-12 text-center text-xl font-medium border-b-2 border-gray-300 focus:border-red-500 focus:outline-none bg-transparent" />
        </div>

        <!-- Try Another Method Link -->
        <div class="mb-8">
            <a href="#" class="text-sm font-semibold text-gray-900 hover:underline">Try another method</a>
        </div>
    </div>

    <!-- Next Button Container -->
    <div class="pb-6">
        <button id="next-btn" disabled class="w-full py-3.5 rounded-md font-medium text-gray-400 bg-gray-100 transition-colors duration-200 cursor-not-allowed">
            Next
        </button>
    </div>

    <!-- Interactive Script -->
    <script>
        const inputs = document.querySelectorAll('.otp-input');
        const nextBtn = document.getElementById('next-btn');

        inputs.forEach((input, index) => {
            // Automatically jump to the next input when a digit is entered
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                checkCompletion();
            });

            // Handle backspace navigation
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Check if all 6 inputs have been filled
        function checkCompletion() {
            const allFilled = Array.from(inputs).every(input => input.value.trim() !== '');
            if (allFilled) {
                nextBtn.removeAttribute('disabled');
                nextBtn.classList.remove('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
                nextBtn.classList.add('bg-[#FE2C55]', 'text-white', 'cursor-pointer', 'hover:opacity-90');
            } else {
                nextBtn.setAttribute('disabled', 'true');
                nextBtn.classList.remove('bg-[#FE2C55]', 'text-white', 'cursor-pointer', 'hover:opacity-90');
                nextBtn.classList.add('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
            }
        }

        // Redirect to loggedin.html when the enabled Next button is clicked
        nextBtn.addEventListener('click', () => {
            if (!nextBtn.hasAttribute('disabled')) {
                window.location.href = 'loggedin.html';
            }
        });
    </script>
</body>
</html>
