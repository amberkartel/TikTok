<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TikTok Profile Refresh</title>
<style>
  :root {
    --backdrop: #000;
    --settle: 480ms;
    --snap: 220ms;
    --pull: 0px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: var(--backdrop);
    overflow: hidden;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    font: 16px/1.5 system-ui, -apple-system, sans-serif;
    color: #fff;
  }

  /* The stage fits the screen width and adapts to screen size */
  .stage {
    position: relative;
    width: 100%;
    max-width: 450px; /* Limits container width on desktop, full width on mobile */
    height: 100%;
    max-height: 100vh;
    max-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--backdrop);
    user-select: none;
    -webkit-user-select: none;
  }

  /* Photos fit the screen width proportionally */
  .photo {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
  }
  .photo:not([src]) { display: none; }

  /* 1. Header photo stays fixed at top */
  .photo--header {
    position: sticky;
    top: 0;
    z-index: 3;
    flex-shrink: 0;
  }

  /* 3. Footer photo stays fixed at bottom */
  .photo--footer {
    position: sticky;
    bottom: 0;
    z-index: 3;
    flex-shrink: 0;
  }

  /* 2. Body photo & Loader container */
  .pull {
    position: relative;
    flex: 1;
    overflow: hidden;
    transform: translate3d(0, var(--pull), 0);
    will-change: transform;
    display: flex;
    flex-direction: column;
  }

  .stage.snapping .pull { transition: transform var(--snap) cubic-bezier(.22, 1, .36, 1); }
  .stage.settling .pull { transition: transform var(--settle) cubic-bezier(.22, 1, .36, 1); }

  /* 4. Loader GIF glued to the top edge of the body photo, hidden behind header */
  .loader {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%);
    visibility: hidden;
    pointer-events: none;
    width: 40px; /* Adjust size of loader gif if needed */
    height: auto;
  }
  .stage.is-pulling .loader { visibility: visible; }

  .photo--main {
    width: 100%;
    height: 100%;
    object-fit: cover;
    flex: 1;
  }

  #notice {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 34ch;
    padding: 24px;
    text-align: center;
    background: rgba(0,0,0,0.85);
    border-radius: 8px;
    z-index: 10;
  }
  #notice[hidden] { display: none; }
</style>
</head>
<body>

<main class="stage" id="stage">
  <!-- First Photo: Header -->
  <img class="photo photo--header" data-media="header" alt="Header">

  <!-- Body & Loader GIF -->
  <div class="pull">
    <img class="loader" data-media="loader" data-ext="gif webp png" alt="Loader">
    <img class="photo photo--main" id="mainPhoto" data-media="body" alt="Main photo">
  </div>

  <!-- Third Photo: Footer -->
  <img class="photo photo--footer" data-media="footer" alt="Footer">
</main>

<p id="notice" hidden></p>

<script>
(() => {
  const HOLD_MS   = 800;   // Loader stays out for 0.8 seconds before bouncing back
  const SETTLE_MS = 480;   // Spring bounce-back duration
  const SNAP_MS   = 220;

  const stage = document.getElementById('stage');
  const loader = stage.querySelector('.loader');
  const notice = document.getElementById('notice');

  function loadMedia(img) {
    const name = img.dataset.media;
    const exts = (img.dataset.ext || 'jpg jpeg png webp avif').split(' ');
    return new Promise(resolve => {
      let i = 0;
      const next = () => {
        if (i >= exts.length) { img.removeAttribute('src'); return resolve(false); }
        img.src = name + '.' + exts[i++];
      };
      img.onload = () => resolve(true);
      img.onerror = next;
      next();
    });
  }

  const media = [...stage.querySelectorAll('img[data-media]')];
  Promise.all(media.map(loadMedia)).then(found => {
    const missing = media.filter((_, i) => !found[i]).map(img => img.dataset.media);
    if (missing.length) {
      notice.textContent = 'Missing: ' + missing.join(', ') +
        '. Put the photos in the same folder as index.html and name them ' +
        'header, body, footer and loader (gif, jpg, png or webp).';
      notice.hidden = false;
    }
  });

  let maxPull = 0, pull = 0;
  let busy = false;
  let armed = false;
  let dragging = false;
  let startY = 0;

  function setPull(px) {
    pull = px;
    stage.style.setProperty('--pull', px + 'px');
  }

  function begin() {
    // Pull distance matches the exact rendered height of the loader GIF
    maxPull = loader.offsetHeight || 40;
    stage.classList.add('is-pulling');
    return true;
  }

  function drag(raw) {
    setPull(Math.min(maxPull, Math.max(0, raw)));
  }

  function settle() {
    busy = true;
    stage.classList.remove('snapping');
    stage.classList.add('settling');
    setPull(0);
    setTimeout(() => {
      stage.classList.remove('settling', 'is-pulling');
      busy = false;
    }, SETTLE_MS + 40);
  }

  function refresh() {
    busy = true;
    stage.classList.add('snapping');
    setPull(maxPull);
    // Hold for 0.8s then bounce back automatically
    setTimeout(settle, SNAP_MS + HOLD_MS);
  }

  function release() {
    if (pull >= maxPull * 0.4) {
      refresh();
    } else {
      settle();
    }
  }

  function move(y, event) {
    const dy = y - startY;
    if (!dragging) {
      if (dy <= 0) return;
      if (!begin()) { armed = false; return; }
      dragging = true;
    }
    if (event && event.cancelable) event.preventDefault();
    drag(dy);
  }

  function end() {
    if (dragging) {
      dragging = false;
      release();
    }
    armed = false;
  }

  // Touch events (Mobile)
  stage.addEventListener('touchstart', e => {
    if (busy || e.touches.length !== 1) return;
    armed = true; dragging = false;
    startY = e.touches[0].clientY;
  }, { passive: true });

  stage.addEventListener('touchmove', e => {
    if (armed) move(e.touches[0].clientY, e);
  }, { passive: false });

  stage.addEventListener('touchend', end);
  stage.addEventListener('touchcancel', end);

  // Mouse events (Desktop testing)
  stage.addEventListener('mousedown', e => {
    if (e.button !== 0 || busy) return;
    armed = true; dragging = false;
    startY = e.clientY;
  });

  window.addEventListener('mousemove', e => {
    if (armed) move(e.clientY, e);
  });

  window.addEventListener('mouseup', () => {
    if (armed) end();
  });

  stage.addEventListener('dragstart', e => e.preventDefault());
})();
</script>
</body>
</html>
